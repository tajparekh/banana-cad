<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>3D CAD · plate · builds library · drag from toolbox</title>
<style>
  *{box-sizing:border-box;user-select:none}
  html,body{margin:0;padding:0;background:#0f0f1a;font-family:system-ui,sans-serif;color:#e0e0f0;overflow:hidden;height:100vh}
  .app{display:flex;flex-direction:column;gap:10px;padding:12px;height:100vh}
  .top-bar{display:flex;align-items:center;gap:14px;background:rgba(30,30,50,.7);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:10px 18px;box-shadow:0 8px 32px rgba(0,0,0,.4);flex-wrap:wrap;flex-shrink:0}
  .top-bar .group{display:flex;align-items:center;gap:8px}
  .top-bar label{color:#9a9ac0;font-size:.65rem;font-weight:600;text-transform:uppercase;letter-spacing:1.2px}
  .top-bar input[type=range]{width:100px;accent-color:#6b8eff;cursor:pointer}
  .top-bar input[type=range]:disabled{opacity:.3}
  .scale-value,.y-value{color:#ffd966;font-weight:700;font-size:.8rem;min-width:48px;text-align:center;background:rgba(255,255,255,.06);padding:4px 10px;border-radius:8px;border:1px solid rgba(255,255,255,.08)}
  .y-value{min-width:64px}
  .view-btn,.y-btn,.fuse-btn,.delete-btn,.rot-btn,.dup-btn,.group-btn,.import-btn,.save-btn{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);color:#d0d0f0;border-radius:10px;padding:6px 14px;font-size:.7rem;font-weight:600;cursor:pointer;transition:all .15s}
  .view-btn:hover,.y-btn:hover,.rot-btn:hover,.dup-btn:hover,.group-btn:hover,.import-btn:hover,.save-btn:hover{background:rgba(255,255,255,.12)}
  .y-btn{padding:6px 12px;font-size:.85rem;min-width:40px}
  .fuse-btn{background:rgba(80,200,120,.15);border-color:rgba(80,200,120,.3);color:#a0ffc0}
  .delete-btn{background:rgba(220,80,80,.15);border-color:rgba(220,80,80,.3);color:#ffb0b0}
  .dup-btn{background:rgba(200,160,80,.15);border-color:rgba(200,160,80,.3);color:#ffe0a0}
  .group-btn{background:rgba(140,120,220,.15);border-color:rgba(140,120,220,.3);color:#d0c0ff}
  .import-btn{background:rgba(80,160,220,.15);border-color:rgba(80,160,220,.3);color:#a0d0ff}
  .save-btn{background:rgba(220,140,220,.15);border-color:rgba(220,140,220,.3);color:#f0b0f0}
  .fuse-btn:disabled,.delete-btn:disabled,.dup-btn:disabled,.group-btn:disabled,.save-btn:disabled{opacity:.3;cursor:not-allowed}
  .select-hint{color:#7a9fd0;font-size:.6rem;background:rgba(60,90,140,.2);padding:4px 10px;border-radius:20px;border:1px solid rgba(60,90,140,.3)}
  .shape-toggle{background:linear-gradient(135deg,#6b8eff,#8b6bff);border:none;color:#fff;border-radius:10px;padding:7px 16px;font-size:.72rem;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px;transition:transform .15s;box-shadow:0 4px 15px rgba(107,142,255,.3)}
  .shape-toggle:hover{transform:translateY(-1px)}
  .shape-toggle .chevron{font-size:.6rem;transition:transform .2s}
  .shape-toggle.open .chevron{transform:rotate(180deg)}
  .shape-modal{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(.95);width:90vw;max-width:900px;max-height:80vh;background:rgba(25,25,45,.95);backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,.1);border-radius:24px;box-shadow:0 24px 80px rgba(0,0,0,.7);padding:24px;display:flex;flex-direction:column;gap:16px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:100}
  .shape-modal.open{opacity:1;pointer-events:all;transform:translate(-50%,-50%) scale(1)}
  .shape-modal-header{display:flex;justify-content:space-between;align-items:center}
  .shape-modal-header h2{margin:0;font-size:1rem;font-weight:700}
  .close-btn{background:rgba(255,255,255,.08);border:none;color:#c0c0e0;width:32px;height:32px;border-radius:50%;font-size:1.1rem;cursor:pointer}
  .shape-search{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:10px 16px;color:#e0e0f0;font-size:.8rem;outline:none;width:100%}
  .tabs{display:flex;gap:6px}
  .tab{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);color:#a0a0c0;padding:6px 16px;border-radius:10px;font-size:.7rem;font-weight:600;cursor:pointer;transition:all .15s}
  .tab.active{background:rgba(107,142,255,.2);border-color:rgba(107,142,255,.4);color:#c0d0ff}
  .tab:hover{background:rgba(255,255,255,.1)}
  .shape-modal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;overflow-y:auto;padding-right:4px;flex:1;min-height:0}
  .shape-modal-item{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);border-radius:14px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:grab;transition:all .15s;aspect-ratio:1;position:relative}
  .shape-modal-item:hover{background:rgba(107,142,255,.12);border-color:rgba(107,142,255,.3);transform:translateY(-2px)}
  .shape-modal-item.build{border-color:rgba(220,140,220,.3)}
  .shape-modal-item.build:hover{background:rgba(220,140,220,.15);border-color:rgba(220,140,220,.5)}
  .shape-modal-item .icon{font-size:26px;line-height:1}
  .shape-modal-item .lbl{font-size:.55rem;color:#a0a0c0;text-transform:uppercase;text-align:center;line-height:1.2;font-weight:600}
  .shape-modal-item .del-build{position:absolute;top:4px;right:4px;width:18px;height:18px;border-radius:50%;background:rgba(220,80,80,.3);border:none;color:#ffb0b0;font-size:.7rem;cursor:pointer;display:none;align-items:center;justify-content:center}
  .shape-modal-item.build:hover .del-build{display:flex}
  .shape-modal-item .del-build:hover{background:rgba(220,80,80,.6)}
  .empty-builds{color:#6a6a8a;font-size:.8rem;text-align:center;padding:40px 20px;grid-column:1/-1}
  .main-row{display:flex;gap:10px;flex:1;min-height:0}
  .sidebar{display:flex;flex-direction:column;gap:10px;width:160px;flex-shrink:0}
  .panel{background:rgba(30,30,50,.6);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.07);border-radius:16px;padding:12px 10px;display:flex;flex-direction:column;align-items:center;gap:8px}
  .panel h3{margin:0;font-size:.6rem;font-weight:700;letter-spacing:1.2px;color:#8a8ab0;text-transform:uppercase}
  .color-row{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
  .color-swatch{width:22px;height:22px;border-radius:50%;border:2px solid rgba(255,255,255,.15);cursor:pointer;transition:transform .12s}
  .color-swatch:hover{transform:scale(1.15)}
  .color-swatch.active{border-color:#ffd966;transform:scale(1.2)}
  .rotate-buttons{display:grid;grid-template-columns:1fr 1fr;gap:5px;width:100%}
  .rot-btn{padding:6px 2px;font-size:.6rem;border-radius:8px}
  .rot-btn.full{grid-column:span 2}
  .canvas-wrapper{background:rgba(15,15,30,.8);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.07);border-radius:18px;position:relative;flex:1;min-width:0;min-height:0;overflow:hidden}
  #mainCanvas{display:block;width:100%;height:100%;cursor:default}
  .status-bar{position:absolute;bottom:12px;left:14px;color:#ababce;font-size:.65rem;background:rgba(15,15,30,.8);padding:5px 14px;border-radius:20px;border:1px solid rgba(255,255,255,.08);pointer-events:none;display:flex;gap:10px}
  .status-bar span{color:#ffd966;font-weight:600}
  .hint{position:absolute;top:12px;right:14px;color:#7a7aa8;font-size:.6rem;background:rgba(15,15,30,.8);padding:4px 12px;border-radius:20px;pointer-events:none}
  .badge{position:absolute;top:46px;right:14px;font-size:.6rem;padding:4px 12px;border-radius:20px;pointer-events:none;display:none}
  .badge.show{display:block}
  .badge.fuse{color:#a0ffc0;background:rgba(30,80,40,.8)}
  .badge.multi{color:#c0e0ff;background:rgba(30,50,90,.8)}
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .2s;z-index:99}
  .overlay.open{opacity:1;pointer-events:all}
  .shape-count-badge{background:rgba(107,142,255,.15);border:1px solid rgba(107,142,255,.3);color:#a0b8ff;padding:4px 10px;border-radius:20px;font-size:.6rem;font-weight:600}
  .import-input{display:none}
  .drag-ghost{position:fixed;pointer-events:none;z-index:1000;background:rgba(107,142,255,.9);color:#fff;padding:6px 14px;border-radius:20px;font-size:.7rem;font-weight:700;display:none;transform:translate(-50%,-50%)}
  .drag-ghost.show{display:block}
</style>
</head>
<body>
<div class="app">
  <div class="top-bar">
    <button class="shape-toggle" id="shapeToggle"><span>📦 Add Shape</span><span class="chevron">▼</span></button>
    <span class="shape-count-badge" id="shapeCountBadge">0 shapes</span>
    <div class="group"><label>Scale</label><input type="range" id="scaleSlider" min="0.3" max="4" step="0.05" value="1" disabled><span class="scale-value" id="scaleValue">1.00</span></div>
    <div class="group"><label>Y</label><button class="y-btn" id="yDown">▼</button><span class="y-value" id="yValue">0.00</span><button class="y-btn" id="yUp">▲</button></div>
    <div class="group"><label>View</label><button class="view-btn" id="viewTop">top</button><button class="view-btn" id="viewFront">front</button><button class="view-btn" id="viewIso">iso</button><button class="view-btn" id="viewReset">reset</button></div>
    <div class="group">
      <button class="save-btn" id="saveBtn" disabled>💾 Save Build</button>
      <button class="dup-btn" id="dupBtn" disabled>📋 Duplicate</button>
      <button class="group-btn" id="groupBtn" disabled>🔗 Group</button>
      <button class="fuse-btn" id="fuseBtn" disabled>🔗 Fuse</button>
      <button class="delete-btn" id="deleteBtn" disabled>🗑 Delete</button>
      <button class="import-btn" id="importBtn">📂 Import</button>
      <input type="file" class="import-input" id="importInput" accept=".json">
    </div>
    <div class="select-hint"><span id="modKey">⌘/Ctrl</span>+click → multi-select</div>
  </div>
  <div class="main-row">
    <div class="sidebar">
      <div class="panel"><h3>color</h3><div class="color-row" id="colorRow"></div></div>
      <div class="panel"><h3>rotate</h3><div class="rotate-buttons">
        <button class="rot-btn" data-axis="x" data-dir="-1">X−</button><button class="rot-btn" data-axis="x" data-dir="1">X+</button>
        <button class="rot-btn" data-axis="y" data-dir="-1">Y−</button><button class="rot-btn" data-axis="y" data-dir="1">Y+</button>
        <button class="rot-btn" data-axis="z" data-dir="-1">Z−</button><button class="rot-btn" data-axis="z" data-dir="1">Z+</button>
        <button class="rot-btn full" id="resetRotation">reset rot</button>
      </div></div>
    </div>
    <div class="canvas-wrapper">
      <canvas id="mainCanvas"></canvas>
      <div class="hint">drag from toolbox · ⌘/Ctrl+click multi · shift+drag Y · scroll zoom</div>
      <div class="badge fuse" id="fuseBadge">🔗 fused group</div>
      <div class="badge multi" id="multiBadge">✱ multi-selection</div>
      <div class="status-bar"><span id="shapeCount">0</span> shapes <span id="selectedInfo">none selected</span></div>
    </div>
  </div>
</div>
<div class="overlay" id="overlay"></div>
<div class="shape-modal" id="shapeModal">
  <div class="shape-modal-header"><h2>📦 Shape Library</h2><button class="close-btn" id="closeModal">✕</button></div>
  <div class="tabs">
    <button class="tab active" data-tab="shapes">Shapes</button>
    <button class="tab" data-tab="builds">🏗️ Builds</button>
  </div>
  <input type="text" class="shape-search" id="shapeSearch" placeholder="Search shapes...">
  <div class="shape-modal-grid" id="shapeGrid"></div>
</div>
<div class="drag-ghost" id="dragGhost">shape</div>
<script>
(function(){
'use strict';
const canvas=document.getElementById('mainCanvas'),ctx=canvas.getContext('2d');
let W=800,H=600;
const v3=(x,y,z)=>({x,y,z}),vadd=(a,b)=>v3(a.x+b.x,a.y+b.y,a.z+b.z),vsub=(a,b)=>v3(a.x-b.x,a.y-b.y,a.z-b.z),vscale=(a,s)=>v3(a.x*s,a.y*s,a.z*s),vdot=(a,b)=>a.x*b.x+a.y*b.y+a.z*b.z,vcross=(a,b)=>v3(a.y*b.z-a.z*b.y,a.z*b.x-a.x*b.z,a.x*b.y-a.y*b.x),vlen=a=>Math.sqrt(vdot(a,a)),vnorm=a=>{const l=vlen(a);return l>1e-4?vscale(a,1/l):v3(0,0,0)};
const camera={target:v3(0,3,0),distance:38,yaw:.7,pitch:.55,fov:50*Math.PI/180},MAP_SIZE=20;
function getEye(){const cp=Math.cos(camera.pitch);return v3(camera.target.x+camera.distance*cp*Math.sin(camera.yaw),camera.target.y+camera.distance*Math.sin(camera.pitch),camera.target.z+camera.distance*cp*Math.cos(camera.yaw))}
function getView(){const eye=getEye(),forward=vnorm(vsub(camera.target,eye));let right=vcross(forward,v3(0,1,0));if(vlen(right)<.001)right=v3(1,0,0);right=vnorm(right);return{eye,forward,right,up:vnorm(vcross(right,forward))}}
function project(p,view){const rel=vsub(p,view.eye),cx=vdot(rel,view.right),cy=vdot(rel,view.up),cz=vdot(rel,view.forward);if(cz<.15)return null;const f=(H/2)/Math.tan(camera.fov/2);return{x:W/2+cx*f/cz,y:H/2-cy*f/cz,depth:cz}}
function mesh(v,e,f){return{vertices:v,edges:e,faces:f}}
function resizeCanvas(){const r=canvas.getBoundingClientRect();W=Math.max(1,Math.floor(r.width));H=Math.max(1,Math.floor(r.height));canvas.width=W;canvas.height=H}

const G={
box:()=>{const v=[v3(-.9,0,-.6),v3(.9,0,-.6),v3(.9,0,.6),v3(-.9,0,.6),v3(-.9,1.2,-.6),v3(.9,1.2,-.6),v3(.9,1.2,.6),v3(-.9,1.2,.6)];return mesh(v,[[0,1],[1,2],[2,3],[3,0],[4,5],[5,6],[6,7],[7,4],[0,4],[1,5],[2,6],[3,7]],[[0,1,2,3],[4,5,6,7],[0,1,5,4],[1,2,6,5],[2,3,7,6],[3,0,4,7]])},
sphere:(su=10,sv=7,r=.9)=>{const v=[],e=[],f=[];for(let j=0;j<=sv;j++)for(let i=0;i<=su;i++){const phi=j/sv*Math.PI,theta=i/su*Math.PI*2;v.push(v3(r*Math.sin(phi)*Math.cos(theta),r-r*Math.cos(phi),r*Math.sin(phi)*Math.sin(theta)))}for(let j=0;j<=sv;j++)for(let i=0;i<su;i++)e.push([j*(su+1)+i,j*(su+1)+i+1]);for(let i=0;i<=su;i++)for(let j=0;j<sv;j++)e.push([j*(su+1)+i,(j+1)*(su+1)+i]);for(let j=0;j<sv;j++)for(let i=0;i<su;i++){const a=j*(su+1)+i;f.push([a,a+1,a+su+2,a+su+1])}return mesh(v,e,f)},
cyl:(seg=16,r=.8,h=1.6)=>{const v=[],e=[],f=[];for(let i=0;i<seg;i++){const t=i/seg*Math.PI*2;v.push(v3(r*Math.cos(t),0,r*Math.sin(t)))}for(let i=0;i<seg;i++){const t=i/seg*Math.PI*2;v.push(v3(r*Math.cos(t),h,r*Math.sin(t)))}const bc=v.length;v.push(v3(0,0,0));const tc=v.length;v.push(v3(0,h,0));for(let i=0;i<seg;i++){const ni=(i+1)%seg;e.push([i,ni],[seg+i,seg+ni],[i,seg+i])}for(let i=0;i<seg;i++){const ni=(i+1)%seg;f.push([bc,ni,i],[tc,seg+i,seg+ni],[i,seg+i,seg+ni,ni])}return mesh(v,e,f)},
cone:(seg=16,r=.9,h=1.7)=>{const v=[],e=[],f=[];for(let i=0;i<seg;i++){const t=i/seg*Math.PI*2;v.push(v3(r*Math.cos(t),0,r*Math.sin(t)))}const apex=v.length;v.push(v3(0,h,0));const bc=v.length;v.push(v3(0,0,0));for(let i=0;i<seg;i++)e.push([i,(i+1)%seg],[i,apex]);for(let i=0;i<seg;i++){const ni=(i+1)%seg;f.push([bc,ni,i],[i,ni,apex])}return mesh(v,e,f)},
torus:(su=16,sv=8,R=.8,r=.3)=>{const v=[],e=[],f=[];for(let i=0;i<su;i++)for(let j=0;j<sv;j++){const u=i/su*Math.PI*2,vv=j/sv*Math.PI*2;v.push(v3((R+r*Math.cos(vv))*Math.cos(u),r*Math.sin(vv)+r+.3,(R+r*Math.cos(vv))*Math.sin(u)))}for(let i=0;i<su;i++)for(let j=0;j<sv;j++){const a=i*sv+j;e.push([a,((i+1)%su)*sv+j],[a,i*sv+(j+1)%sv])}for(let i=0;i<su;i++)for(let j=0;j<sv;j++){const a=i*sv+j,b=i*sv+(j+1)%sv,c=((i+1)%su)*sv+(j+1)%sv,d=((i+1)%su)*sv+j;f.push([a,d,c,b])}return mesh(v,e,f)},
tetra:()=>mesh([v3(0,1.4,0),v3(-1,0,-.6),v3(1,0,-.6),v3(0,0,1.1)],[[0,1],[0,2],[0,3],[1,2],[2,3],[3,1]],[[0,2,1],[0,1,3],[0,3,2],[1,2,3]]),
octa:()=>{const s=.9,v=[v3(0,1.5,0),v3(s,.75,0),v3(0,.75,s),v3(-s,.75,0),v3(0,.75,-s),v3(0,0,0)];return mesh(v,[[0,1],[0,2],[0,3],[0,4],[5,1],[5,2],[5,3],[5,4],[1,2],[2,3],[3,4],[4,1]],[[0,2,1],[0,3,2],[0,4,3],[0,1,4],[5,1,2],[5,2,3],[5,3,4],[5,4,1]])},
pyramid:()=>mesh([v3(0,1.6,0),v3(-.9,0,-.9),v3(.9,0,-.9),v3(.9,0,.9),v3(-.9,0,.9)],[[0,1],[0,2],[0,3],[0,4],[1,2],[2,3],[3,4],[4,1]],[[0,2,1],[0,3,2],[0,4,3],[0,1,4],[1,2,3,4]]),

capsule:()=>{const v=[],e=[],f=[],r=.55,cylH=.9,su=10,sv=4;const bp=v.length;v.push(v3(0,0,0));const br=v.length;for(let j=1;j<=sv;j++){const phi=j/sv*(Math.PI/2),y=r-r*Math.cos(phi),rad=r*Math.sin(phi);for(let i=0;i<su;i++){const t=i/su*Math.PI*2;v.push(v3(rad*Math.cos(t),y,rad*Math.sin(t)))}}const be=br+(sv-1)*su;const te=v.length;for(let i=0;i<su;i++){const t=i/su*Math.PI*2;v.push(v3(r*Math.cos(t),r+cylH,r*Math.sin(t)))}const th=v.length;for(let j=1;j<sv;j++){const phi=j/sv*(Math.PI/2),y=r+cylH+r*Math.sin(phi),rad=r*Math.cos(phi);for(let i=0;i<su;i++){const t=i/su*Math.PI*2;v.push(v3(rad*Math.cos(t),y,rad*Math.sin(t)))}}const tp=v.length;v.push(v3(0,r+cylH+r,0));for(let i=0;i<su;i++)e.push([bp,br+i]);for(let j=0;j<sv-2;j++){const a=br+j*su,b=br+(j+1)*su;for(let i=0;i<su;i++)e.push([a+i,b+i])}for(let i=0;i<su;i++)e.push([be+i,te+i],[te+i,th+i]);for(let j=0;j<sv-2;j++){const a=th+j*su,b=th+(j+1)*su;for(let i=0;i<su;i++)e.push([a+i,b+i])}const ltr=th+(sv-2)*su;for(let i=0;i<su;i++)e.push([ltr+i,tp]);for(let i=0;i<su;i++){const ni=(i+1)%su;for(let j=0;j<sv-1;j++)e.push([br+j*su+i,br+j*su+ni]);e.push([be+i,be+ni],[te+i,te+ni]);for(let j=0;j<sv-1;j++)e.push([th+j*su+i,th+j*su+ni])}for(let i=0;i<su;i++){const ni=(i+1)%su;f.push([bp,br+ni,br+i])}for(let j=0;j<sv-2;j++){const a=br+j*su,b=br+(j+1)*su;for(let i=0;i<su;i++){const ni=(i+1)%su;f.push([a+i,a+ni,b+ni,b+i])}}for(let i=0;i<su;i++){const ni=(i+1)%su;f.push([be+i,be+ni,te+ni,te+i],[te+i,te+ni,th+ni,th+i])}for(let j=0;j<sv-2;j++){const a=th+j*su,b=th+(j+1)*su;for(let i=0;i<su;i++){const ni=(i+1)%su;f.push([a+i,a+ni,b+ni,b+i])}}for(let i=0;i<su;i++){const ni=(i+1)%su;f.push([tp,ltr+i,ltr+ni])}return mesh(v,e,f)},

// --- BUILD HUMANS ---
function buildHumanParts(opts){
const h=opts.height||1.75,headR=h*.075,neckH=h*.04,neckR=h*.028,torsoH=h*.30,torsoW=h*.13,torsoD=h*.075,upperArmH=h*.16,forearmH=h*.14,armR=h*.022,upperArmR=h*.028,handH=h*.05,handR=h*.030,thighH=h*.23,calfH=h*.21,thighR=h*.038,calfR=h*.032,footH=h*.03,footL=h*.075,parts=[];
const torsoGeo=mesh([v3(-torsoW/2,0,-torsoD/2),v3(torsoW/2,0,-torsoD/2),v3(torsoW/2,0,torsoD/2),v3(-torsoW/2,0,torsoD/2),v3(-torsoW/2*.85,torsoH,-torsoD/2*.85),v3(torsoW/2*.85,torsoH,-torsoD/2*.85),v3(torsoW/2*.85,torsoH,torsoD/2*.85),v3(-torsoW/2*.85,torsoH,torsoD/2*.85)],[[0,1],[1,2],[2,3],[3,0],[4,5],[5,6],[6,7],[7,4],[0,4],[1,5],[2,6],[3,7]],[[0,1,2,3],[4,5,6,7],[0,1,5,4],[1,2,6,5],[2,3,7,6],[3,0,4,7]]);
parts.push({type:'torso',geo:torsoGeo,relPos:v3(0,0,0),rot:v3(0,0,0),scale:1});
parts.push({type:'neck',geo:G.cyl(8,neckR,neckH),relPos:v3(0,torsoH,0),rot:v3(0,0,0),scale:1});
parts.push({type:'head',geo:G.sphereLow(headR,10,8),relPos:v3(0,torsoH+neckH,0),rot:v3(0,0,0),scale:1});
const shoulderGeo=G.sphereLow(upperArmR*1.1,6,4);
parts.push({type:'shoulderL',geo:shoulderGeo,relPos:v3(-torsoW/2,torsoH*.92,0),rot:v3(0,0,0),scale:1});
parts.push({type:'shoulderR',geo:shoulderGeo,relPos:v3(torsoW/2,torsoH*.92,0),rot:v3(0,0,0),scale:1});
const upperArmGeo=G.cyl(8,upperArmR,upperArmH),uaY=torsoH*.92-upperArmH;
parts.push({type:'upperArmL',geo:upperArmGeo,relPos:v3(-torsoW/2,uaY,0),rot:v3(0,0,0),scale:1});
parts.push({type:'upperArmR',geo:upperArmGeo,relPos:v3(torsoW/2,uaY,0),rot:v3(0,0,0),scale:1});
const forearmGeo=G.cyl(8,armR,forearmH),faY=uaY-forearmH;
parts.push({type:'forearmL',geo:forearmGeo,relPos:v3(-torsoW/2,faY,0),rot:v3(0,0,0),scale:1});
parts.push({type:'forearmR',geo:forearmGeo,relPos:v3(torsoW/2,faY,0),rot:v3(0,0,0),scale:1});
const handGeo=G.diskThin(handR,handH,8),haY=faY-handH;
parts.push({type:'handL',geo:handGeo,relPos:v3(-torsoW/2,haY,0),rot:v3(0,0,0),scale:1});
parts.push({type:'handR',geo:handGeo,relPos:v3(torsoW/2,haY,0),rot:v3(0,0,0),scale:1});
const hipsGeo=mesh([v3(-torsoW/2*.9,0,-torsoD/2*.9),v3(torsoW/2*.9,0,-torsoD/2*.9),v3(torsoW/2*.9,0,torsoD/2*.9),v3(-torsoW/2*.9,0,torsoD/2*.9),v3(-torsoW/2*.9,h*.05,-torsoD/2*.9),v3(torsoW/2*.9,h*.05,-torsoD/2*.9),v3(torsoW/2*.9,h*.05,torsoD/2*.9),v3(-torsoW/2*.9,h*.05,torsoD/2*.9)],[[0,1],[1,2],[2,3],[3,0],[4,5],[5,6],[6,7],[7,4],[0,4],[1,5],[2,6],[3,7]],[[0,1,2,3],[4,5,6,7],[0,1,5,4],[1,2,6,5],[2,3,7,6],[3,0,4,7]]);
parts.push({type:'hips',geo:hipsGeo,relPos:v3(0,-h*.05,0),rot:v3(0,0,0),scale:1});
const legSpread=torsoW*.28,thighGeo=G.cyl(8,thighR,thighH),thY=-h*.05-thighH;
parts.push({type:'thighL',geo:thighGeo,relPos:v3(-legSpread,thY,0),rot:v3(0,0,0),scale:1});
parts.push({type:'thighR',geo:thighGeo,relPos:v3(legSpread,thY,0),rot:v3(0,0,0),scale:1});
const calfGeo=G.cyl(8,calfR,calfH),caY=thY-calfH;
parts.push({type:'calfL',geo:calfGeo,relPos:v3(-legSpread,caY,0),rot:v3(0,0,0),scale:1});
parts.push({type:'calfR',geo:calfGeo,relPos:v3(legSpread,caY,0),rot:v3(0,0,0),scale:1});
const footGeo=mesh([v3(-footL/2,0,-footL/2),v3(footL/2,0,-footL/2),v3(footL/2,0,footL/2),v3(-footL/2,0,footL/2),v3(-footL/2,footH,-footL/2),v3(footL/2,footH,-footL/2),v3(footL/2,footH,footL/2),v3(-footL/2,footH,footL/2)],[[0,1],[1,2],[2,3],[3,0],[4,5],[5,6],[6,7],[7,4],[0,4],[1,5],[2,6],[3,7]],[[0,1,2,3],[4,5,6,7],[0,1,5,4],[1,2,6,5],[2,3,7,6],[3,0,4,7]]);
const feY=caY-footH;
parts.push({type:'footL',geo:footGeo,relPos:v3(-legSpread,feY,footL*.15),rot:v3(0,0,0),scale:1});
parts.push({type:'footR',geo:footGeo,relPos:v3(legSpread,feY,footL*.15),rot:v3(0,0,0),scale:1});
return parts;
}

const HUMAN_DEFS={human_stand:{height:1.75},human_tall:{height:2.0},human_short:{height:1.4},human_child:{height:1.1}};
const HUMAN_PARTS={};Object.keys(HUMAN_DEFS).forEach(n=>{HUMAN_PARTS[n]=buildHumanParts(HUMAN_DEFS[n])});

// --- REGISTER SHAPES ---
const GEO={},shapeNames=[];
[['box',G.box],['sphere',G.sphere],['cylinder',G.cyl],['cone',G.cone],['torus',G.torus],['tetra',G.tetra],['octa',G.octa],['pyramid',G.pyramid],['prism',G.prism],['capsule',G.capsule],['torusKnot',G.knot],['star',G.star],['hexPrism',G.hex],['triPrism',G.tri],['disc',G.disc],['ring',G.ring],['cross',G.cross],['tube',G.tube],['frustum',G.frustum],['arrow',G.arrow],['diamond',G.diamond],['gear',G.gear]].forEach(([n,f])=>{GEO[n]=f;shapeNames.push(n)});
function addVar(n,f){GEO[n]=f;shapeNames.push(n)}
for(let i=1;i<=5;i++)addVar('sphere_'+i,()=>G.sphere(6+i*2,4+i));
for(let i=1;i<=6;i++)addVar('cyl_'+i,()=>G.cyl(8+i*4,.4+i*.12,.8+i*.25));
for(let i=1;i<=5;i++)addVar('cone_'+i,()=>G.cone(16,.5+i*.15,1+i*.2));

// ---------- BUILDS LIBRARY ----------
const builds=[]; // saved builds: {id, name, parts: [{type,geo,relPos,rot,scale,color}], color}
let buildCounter=0;

function saveBuildFromShape(shape){
  if(!shape) return;
  let parts;
  if(shape.isFused){
    parts = shape.parts.map(p=>({
      type:p.type, geo:p.geo,
      relPos:v3(p.relPos.x,p.relPos.y,p.relPos.z),
      rot:v3(p.rot.x,p.rot.y,p.rot.z),
      scale:p.scale,
      color:{...p.color}
    }));
  } else {
    // Single primitive: store as a part with identity relPos
    parts = [{
      type:shape.type, geo:shape.geo,
      relPos:v3(0,0,0),
      rot:v3(shape.rot.x,shape.rot.y,shape.rot.z),
      scale:shape.scale,
      color:{...shape.color}
    }];
  }
  buildCounter++;
  const name = 'Build ' + buildCounter;
  builds.push({id:buildCounter, name, parts, color:{...shape.color}});
  rebuildGrid();
  return name;
}

function addBuildToScene(build){
  if(!build) return;
  const parts = build.parts.map(p=>({
    type:p.type, geo:p.geo,
    relPos:v3(p.relPos.x,p.relPos.y,p.relPos.z),
    rot:v3(p.rot.x,p.rot.y,p.rot.z),
    scale:p.scale,
    color:{...p.color}

  const x = Math.random()*6-3, z = Math.random()*6-3;
  const shape = {
    isFused:true,
    isBuild:true,
    parts,
    pos:v3(x,0,z),
    rot:v3(0,0,0),
    scale:1,
    color:build.color
  };
  shapes.push(shape);
  setSelection([shape]);
  updateUI();
}

function deleteBuild(id){

  if(idx>=0){ builds.splice(idx,1); rebuildGrid(); }
}

// ---------- SHAPE FACTORY ----------
function makeShape(type,x,z,colorIdx){
const col=colorIdx!==undefined?COLORS[colorIdx]:activeColor;
if(HUMAN_PARTS[type]){const parts=HUMAN_PARTS[type].map(p=>({type:p.type,geo:p.geo,relPos:v3(p.relPos.x,p.relPos.y,p.relPos.z),rot:v3(p.rot.x,p.rot.y,p.rot.z),scale:p.scale,color:col}));return{isFused:true,isHuman:true,parts,pos:v3(x,0,z),rot:v3(0,0,0),scale:1,color:col}}
const fn=GEO[type];if(!fn)return null;return{type,geo:fn(),pos:v3(x,0,z),rot:v3(0,0,0),scale:1,color:col};
}
function makeFusedGroup(parts,gPos){const gp=v3(gPos.x,gPos.y,gPos.z);const localParts=parts.map(p=>({type:p.type||'shape',geo:p.geo,relPos:v3(p.pos.x-gp.x,p.pos.y-gp.y,p.pos.z-gp.z),rot:v3(p.rot.x,p.rot.y,p.rot.z),scale:p.scale,color:p.color}));return{isFused:true,parts:localParts,pos:gp,rot:v3(0,0,0),scale:1,color:parts[0].color}}
function addDemoShapes(){[['box',-3,-2],['sphere',3,2],['cylinder',0,0],['cone',-3,3],['capsule',3,-3],['human_stand',5,5],['human_short',-5,5]].forEach((d,i)=>{const s=makeShape(d[0],d[1],d[2],i%COLORS.length);if(s)shapes.push(s)})}

function rotateVec(p,rot){let{x,y,z}=p;let c=Math.cos(rot.x),s=Math.sin(rot.x);let ny=y*c-z*s,nz=y*s+z*c;y=ny;z=nz;c=Math.cos(rot.y);s=Math.sin(rot.y);let nx=x*c+z*s;nz=-x*s+z*c;x=nx;z=nz;c=Math.cos(rot.z);s=Math.sin(rot.z);nx=x*c-y*s;ny=x*s+y*c;x=nx;y=ny;return v3(x,y,z)}
function transformVertex(v,shape){return vadd(rotateVec(vscale(v,shape.scale),shape.rot),shape.pos)}
function transformPartVertex(v,part,group){const s=vscale(v,part.scale);const r=rotateVec(s,part.rot);const inGroup=vadd(r,part.relPos);const gs=vscale(inGroup,group.scale);const gr=rotateVec(gs,group.rot);return vadd(gr,group.pos)}
function getWorldVertices(shape){if(shape.isFused){const verts=[];shape.parts.forEach(part=>{part.geo.vertices.forEach(v=>verts.push(transformPartVertex(v,part,shape)))});return verts}return shape.geo.vertices.map(v=>transformVertex(v,shape))}
function getShapeCenter(shape){const verts=getWorldVertices(shape);if(verts.length===0)return shape.pos;let minX=Infinity,minY=Infinity,minZ=Infinity,maxX=-Infinity,maxY=-Infinity,maxZ=-Infinity;verts.forEach(v=>{if(v.x<minX)minX=v.x;if(v.x>maxX)maxX=v.x;if(v.y<minY)minY=v.y;if(v.y>maxY)maxY=v.y;if(v.z<minZ)minZ=v.z;if(v.z>maxZ)maxZ=v.z});return v3((minX+maxX)/2,(minY+maxY)/2,(minZ+maxZ)/2)}
function getMultiCenter(shapesArr){if(shapesArr.length===0)return v3(0,0,0);if(shapesArr.length===1)return getShapeCenter(shapesArr[0]);const c=v3(0,0,0);shapesArr.forEach(s=>{const sc=getShapeCenter(s);c.x+=sc.x;c.y+=sc.y;c.z+=sc.z});return v3(c.x/shapesArr.length,c.y/shapesArr.length,c.z/shapesArr.length)}

// ---------- RENDER ----------
function render(){
if(canvas.width!==W||canvas.height!==H)resizeCanvas();
const g=ctx.createRadialGradient(W/2,H*.4,50,W/2,H/2,Math.max(W,H));
g.addColorStop(0,'#181830');g.addColorStop(1,'#0a0a14');
ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
const view=getView();

// --- GRID / PLATE ---
ctx.strokeStyle='rgba(90,120,180,0.45)';ctx.lineWidth=1.2;
const N=MAP_SIZE;
for(let i=-N;i<=N;i++){
const a1=project(v3(i,0,-N),view),b1=project(v3(i,0,N),view);
if(a1&&b1){ctx.beginPath();ctx.moveTo(a1.x,a1.y);ctx.lineTo(b1.x,b1.y);ctx.stroke()}
const a2=project(v3(-N,0,i),view),b2=project(v3(N,0,i),view);
if(a2&&b2){ctx.beginPath();ctx.moveTo(a2.x,a2.y);ctx.lineTo(b2.x,b2.y);ctx.stroke()}
}
const o=project(v3(0,0,0),view);
if(o){
const px=project(v3(3,0,0),view),pz=project(v3(0,0,3),view);
if(px){ctx.strokeStyle='rgba(255,80,80,0.7)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(o.x,o.y);ctx.lineTo(px.x,px.y);ctx.stroke()}
if(pz){ctx.strokeStyle='rgba(80,80,255,0.7)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(o.x,o.y);ctx.lineTo(pz.x,pz.y);ctx.stroke()}
}

if(selectedShape){
const baseY=getShapeBaseY(selectedShape);
if(baseY>.05){
const pTop=project(v3(selectedShape.pos.x,baseY,selectedShape.pos.z),view);
const pBot=project(v3(selectedShape.pos.x,0,selectedShape.pos.z),view);
if(pTop&&pBot){ctx.strokeStyle='rgba(255,217,102,0.5)';ctx.lineWidth=1.5;ctx.setLineDash([4,4]);ctx.beginPath();ctx.moveTo(pTop.x,pTop.y);ctx.lineTo(pBot.x,pBot.y);ctx.stroke();ctx.fillStyle='rgba(255,217,102,0.7)';ctx.beginPath();ctx.arc(pBot.x,pBot.y,3,0,Math.PI*2);ctx.fill();ctx.setLineDash([])}
}
}

const eye=view.eye;
const sorted=shapes.slice().sort((a,b)=>vlen(vsub(getShapeCenter(b),eye))-vlen(vsub(getShapeCenter(a),eye)));
sorted.forEach(shape=>drawShape(shape,view));

selectedShapes.forEach(shape=>{
const c=getShapeCenter(shape),p=project(c,view);if(!p)return;
const verts=getWorldVertices(shape);let maxR=0;
verts.forEach(v=>{const r=vlen(vsub(v,c));if(r>maxR)maxR=r});
const ringR=Math.max(20,maxR*20+10);
const isPrimary=shape===selectedShape;
ctx.beginPath();ctx.arc(p.x,p.y,ringR,0,Math.PI*2);
if(shape.isFused)ctx.strokeStyle=isPrimary?'#a0ffc0':'#7ad07a';
else ctx.strokeStyle=isPrimary?'#ffd966':'#c0b860';
ctx.lineWidth=isPrimary?2.5:1.8;ctx.setLineDash(isPrimary?[6,5]:[3,5]);ctx.stroke();ctx.setLineDash([]);
});
}

function getShapeBaseY(shape){const verts=getWorldVertices(shape);let minY=Infinity;verts.forEach(v=>{if(v.y<minY)minY=v.y});return minY===Infinity?shape.pos.y:minY}
function drawShape(shape,view){if(shape.isFused)shape.parts.forEach(part=>drawPart(part,shape,view));else drawPrimitive(shape,view)}
function drawPrimitive(shape,view){const geo=shape.geo,worldVerts=geo.vertices.map(v=>transformVertex(v,shape)),proj=worldVerts.map(wp=>project(wp,view)),camPos=view.eye;renderFaces(geo,worldVerts,proj,camPos,shape.color);renderEdges(geo,proj,shape.color.stroke,1.2)}
function drawPart(part,group,view){const geo=part.geo,worldVerts=geo.vertices.map(v=>transformPartVertex(v,part,group)),proj=worldVerts.map(wp=>project(wp,view)),camPos=view.eye;renderFaces(geo,worldVerts,proj,camPos,part.color);renderEdges(geo,proj,part.color.stroke,1)}
function renderFaces(geo,worldVerts,proj,camPos,color){if(geo.faces.length===0)return;const faceData=[];geo.faces.forEach(face=>{let depthSum=0,n=0,visible=false;face.forEach(idx=>{if(proj[idx]){depthSum+=proj[idx].depth;n++;visible=true}});if(visible)faceData.push({face,depth:depthSum/n})});faceData.sort((a,b)=>b.depth-a.depth);const R=parseInt(color.hex.substr(1,2),16),Gc=parseInt(color.hex.substr(3,2),16),B=parseInt(color.hex.substr(5,2),16);faceData.forEach(fd=>{const pts=[];let ok=true;for(const idx of fd.face){const p=proj[idx];if(!p){ok=false;break}pts.push(p)}if(!ok)return;const a=worldVerts[fd.face[0]],b=worldVerts[fd.face[1]],c=worldVerts[fd.face[2]];let nrm=vnorm(vcross(vsub(b,a),vsub(c,a)));if(vdot(nrm,vsub(camPos,a))<0)nrm=vscale(nrm,-1);const diff=Math.max(0,vdot(nrm,vnorm(v3(.4,.9,.5))));const intensity=.35+.65*diff;ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i].x,pts[i].y);ctx.closePath();ctx.fillStyle=`rgb(${Math.min(255,Math.floor(R*intensity))},${Math.min(255,Math.floor(Gc*intensity))},${Math.min(255,Math.floor(B*intensity))})`;ctx.fill();ctx.strokeStyle='rgba(0,0,0,0.15)';ctx.lineWidth=.5;ctx.stroke()})}
function renderEdges(geo,proj,stroke,width){ctx.strokeStyle=stroke;ctx.lineWidth=width;ctx.lineJoin='round';geo.edges.forEach(edge=>{const a=proj[edge[0]],b=proj[edge[1]];if(!a||!b)return;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()})}

// ---------- RAY / PICKING ----------
function screenRay(mx,my){const view=getView(),f=(H/2)/Math.tan(camera.fov/2),ndcX=(mx-W/2)/f,ndcY=-(my-H/2)/f;const dir=vnorm(vadd(vadd(vscale(view.right,ndcX),vscale(view.up,ndcY)),view.forward));return{origin:view.eye,dir}}
function rayGroundY0(ray){if(Math.abs(ray.dir.y)<1e-4)return null;const t=-ray.origin.y/ray.dir.y;return t<0?null:vadd(ray.origin,vscale(ray.dir,t))}
function rayHorizontalPlane(ray,y){if(Math.abs(ray.dir.y)<1e-4)return null;const t=(y-ray.origin.y)/ray.dir.y;return t<0?null:vadd(ray.origin,vscale(ray.dir,t))}
function pickShape(mx,my){const view=getView();let best=null,bestDist=45;shapes.forEach(shape=>{const center=getShapeCenter(shape),p=project(center,view);if(!p)return;const d=Math.hypot(p.x-mx,p.y-my);const verts=getWorldVertices(shape);let maxR=0;verts.forEach(v=>{const r=vlen(vsub(v,center));if(r>maxR)maxR=r});const camDist=vlen(vsub(center,view.eye)),f=(H/2)/Math.tan(camera.fov/2),screenR=(maxR*f)/camDist+10;if(d<screenR&&d<bestDist){bestDist=d;best=shape}});return best}

// ---------- SELECTION ----------
function clearSelection(){selectedShapes.clear();selectedShape=null;updateUI()}
function setSelection(shapesArr){selectedShapes.clear();shapesArr.forEach(s=>selectedShapes.add(s));selectedShape=shapesArr.length>0?shapesArr[shapesArr.length-1]:null;updateUI()}
function toggleSelection(shape){if(selectedShapes.has(shape)){selectedShapes.delete(shape);if(selectedShape===shape){const arr=Array.from(selectedShapes);selectedShape=arr.length>0?arr[arr.length-1]:null}}else{selectedShapes.add(shape);selectedShape=shape}updateUI()}

// ---------- FUSE / GROUP / DUPLICATE ----------
function fuseSelected(){
  if(selectedShapes.size===0)return;
  let partsList;
  if(selectedShapes.size>=2){
    partsList=[];
    selectedShapes.forEach(s=>{
      if(s.isFused)s.parts.forEach(p=>partsList.push({type:p.type,geo:p.geo,pos:v3(s.pos.x+p.relPos.x,s.pos.y+p.relPos.y,s.pos.z+p.relPos.z),rot:p.rot,scale:p.scale,color:p.color}));
      else partsList.push(s)
    })
  } else {
    const primary=selectedShape,pc=getShapeCenter(primary);
    let nearest=null,nd=Infinity;
    shapes.forEach(s=>{if(s===primary)return;const d=vlen(vsub(getShapeCenter(s),pc));if(d<nd){nd=d;nearest=s}});
    if(!nearest)return;
    partsList=[];
    [primary,nearest].forEach(s=>{
      if(s.isFused)s.parts.forEach(p=>partsList.push({type:p.type,geo:p.geo,pos:v3(s.pos.x+p.relPos.x,s.pos.y+p.relPos.y,s.pos.z+p.relPos.z),rot:p.rot,scale:p.scale,color:p.color}));
      else partsList.push(s)
    })
  }
  if(partsList.length<2)return;
  const groupPos=selectedShape?v3(selectedShape.pos.x,selectedShape.pos.y,selectedShape.pos.z):getMultiCenter(Array.from(selectedShapes));
  const group=makeFusedGroup(partsList,groupPos);
  const toRemove=new Set();
  if(selectedShapes.size>=2)selectedShapes.forEach(s=>toRemove.add(s));
  else{
    toRemove.add(selectedShape);
    const pc=getShapeCenter(selectedShape);
    let nearest=null,nd=Infinity;
    shapes.forEach(s=>{if(s===selectedShape)return;const d=vlen(vsub(getShapeCenter(s),pc));if(d<nd){nd=d;nearest=s}});
    if(nearest)toRemove.add(nearest)
  }
  toRemove.forEach(s=>{const i=shapes.indexOf(s);if(i>=0)shapes.splice(i,1)});
  shapes.push(group);
  setSelection([group]);
  // Auto-save the fused group as a build
  saveBuildFromShape(group);
}
function duplicateSelected(){if(selectedShapes.size===0)return;const newShapes=[];selectedShapes.forEach(s=>{if(s.isFused){const copyParts=s.parts.map(p=>({type:p.type,geo:p.geo,relPos:v3(p.relPos.x,p.relPos.y,p.relPos.z),rot:v3(p.rot.x,p.rot.y,p.rot.z),scale:p.scale,color:p.color}));const gc={isFused:true,isHuman:s.isHuman,isBuild:s.isBuild,parts:copyParts,pos:v3(s.pos.x+1.5,s.pos.y,s.pos.z+1.5),rot:v3(s.rot.x,s.rot.y,s.rot.z),scale:s.scale,color:s.color};shapes.push(gc);newShapes.push(gc)}else{const c={type:s.type,geo:s.geo,pos:v3(s.pos.x+1.5,s.pos.y,s.pos.z+1.5),rot:v3(s.rot.x,s.rot.y,s.rot.z),scale:s.scale,color:s.color};shapes.push(c);newShapes.push(c)}});setSelection(newShapes)}
function groupSelected(){fuseSelected()}
function deleteSelected(){if(selectedShapes.size===0)return;selectedShapes.forEach(s=>{const i=shapes.indexOf(s);if(i>=0)shapes.splice(i,1)});clearSelection()}

// ---------- UI UPDATES ----------
function updateUI(){
  document.getElementById('shapeCount').textContent=shapes.length;
  document.getElementById('shapeCountBadge').textContent=shapes.length+' shapes';
  const info=document.getElementById('selectedInfo');
  if(selectedShapes.size>1)info.textContent=selectedShapes.size+' shapes selected';
  else if(selectedShape){
    const rx=Math.round(selectedShape.rot.x*180/Math.PI),ry=Math.round(selectedShape.rot.y*180/Math.PI),rz=Math.round(selectedShape.rot.z*180/Math.PI);
    const kind=selectedShape.isFused?(selectedShape.isBuild?'build':selectedShape.isHuman?'human':'fused['+selectedShape.parts.length+']'):selectedShape.type;
    info.textContent=`${kind} · s:${selectedShape.scale.toFixed(2)} · y:${selectedShape.pos.y.toFixed(2)} · ${rx}° ${ry}° ${rz}°`
  } else info.textContent='none selected';
  document.getElementById('yValue').textContent=selectedShape?selectedShape.pos.y.toFixed(2):'0.00';
  document.getElementById('fuseBadge').className='badge fuse'+((selectedShapes.size===1&&selectedShape&&selectedShape.isFused)?' show':'');
  document.getElementById('multiBadge').className='badge multi'+((selectedShapes.size>1)?' show':'');
  document.getElementById('deleteBtn').disabled=selectedShapes.size===0;
  document.getElementById('fuseBtn').disabled=selectedShapes.size===0||shapes.length<2;
  document.getElementById('dupBtn').disabled=selectedShapes.size===0;
  document.getElementById('groupBtn').disabled=selectedShapes.size<2;
  document.getElementById('saveBtn').disabled=selectedShapes.size===0;
  const ss=document.getElementById('scaleSlider'),sv=document.getElementById('scaleValue');
  if(selectedShape){ss.disabled=false;ss.value=selectedShape.scale;sv.textContent=selectedShape.scale.toFixed(2)}else{ss.disabled=true;ss.value=1;sv.textContent='1.00'}
}

// ---------- INPUT ----------
let mode=null,lastMouse={x:0,y:0},dragOffset=v3(0,0,0),dragStartMouseY=0,dragStartPositions=null;
(function(){const isMac=navigator.platform.toUpperCase().indexOf('MAC')>=0;document.getElementById('modKey').textContent=isMac?'⌘':'Ctrl'})();

canvas.addEventListener('mousedown',e=>{if(e.button!==0)return;const rect=canvas.getBoundingClientRect(),mx=e.clientX-rect.left,my=e.clientY-rect.top,isMultiMod=e.metaKey||e.ctrlKey,hit=pickShape(mx,my);if(hit){if(isMultiMod)toggleSelection(hit);else{if(!selectedShapes.has(hit))setSelection([hit]);else{selectedShape=hit;updateUI()}}if(e.shiftKey){mode='dragY';dragStartMouseY=my;dragStartPositions=new Map();selectedShapes.forEach(s=>dragStartPositions.set(s,v3(s.pos.x,s.pos.y,s.pos.z)))}else{mode='drag';const ray=screenRay(mx,my),gp=rayHorizontalPlane(ray,hit.pos.y);dragOffset=gp?vsub(hit.pos,v3(gp.x,hit.pos.y,gp.z)):v3(0,0,0);dragStartPositions=new Map();selectedShapes.forEach(s=>dragStartPositions.set(s,v3(s.pos.x,s.pos.y,s.pos.z)))}canvas.style.cursor='grabbing'}else{if(!isMultiMod)clearSelection();mode='orbit';lastMouse={x:e.clientX,y:e.clientY};canvas.style.cursor='move'}});

window.addEventListener('mousemove',e=>{const rect=canvas.getBoundingClientRect(),mx=e.clientX-rect.left,my=e.clientY-rect.top;if(mode==='drag'&&selectedShape){const ray=screenRay(mx,my),gp=rayHorizontalPlane(ray,selectedShape.pos.y);if(gp){const nx=gp.x+dragOffset.x,nz=gp.z+dragOffset.z,dx=nx-dragStartPositions.get(selectedShape).x,dz=nz-dragStartPositions.get(selectedShape).z;selectedShapes.forEach(s=>{const st=dragStartPositions.get(s);s.pos.x=Math.max(-MAP_SIZE,Math.min(MAP_SIZE,st.x+dx));s.pos.z=Math.max(-MAP_SIZE,Math.min(MAP_SIZE,st.z+dz))})}}else if(mode==='dragY'&&selectedShape){const view=getView(),camDist=vlen(vsub(selectedShape.pos,view.eye)),f=(H/2)/Math.tan(camera.fov/2),dy=(dragStartMouseY-my)*camDist/f;selectedShapes.forEach(s=>{const st=dragStartPositions.get(s);s.pos.y=Math.max(0,Math.min(MAX_Y,st.y+dy))});updateUI()}else if(mode==='orbit'){camera.yaw-=(e.clientX-lastMouse.x)*.008;camera.pitch=Math.max(-.1,Math.min(1.4,camera.pitch+(e.clientY-lastMouse.y)*.008));lastMouse={x:e.clientX,y:e.clientY}}else{canvas.style.cursor=pickShape(mx,my)?'grab':'default'}});
window.addEventListener('mouseup',()=>{if(mode){mode=null;dragStartPositions=null;canvas.style.cursor='default';updateUI()}});
canvas.addEventListener('wheel',e=>{e.preventDefault();camera.distance=Math.max(5,Math.min(100,camera.distance*(e.deltaY>0?1.1:.9)))},{passive:false});
window.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key==='a'){e.preventDefault();setSelection(shapes.slice());return}if(e.key==='Escape'){clearSelection();return}if((e.key==='Delete'||e.key==='Backspace')&&selectedShapes.size>0){e.preventDefault();deleteSelected();return}if(!selectedShape)return;const step=Math.PI/12;let handled=false;if(e.key==='+'||e.key==='='){selectedShapes.forEach(s=>s.scale=Math.min(4,s.scale*1.1));handled=true}else if(e.key==='-'||e.key==='_'){selectedShapes.forEach(s=>s.scale=Math.max(.3,s.scale/1.1));handled=true}else if(e.key==='0'){selectedShapes.forEach(s=>s.scale=1);handled=true}else if(e.key==='PageUp'){selectedShapes.forEach(s=>s.pos.y=Math.min(MAX_Y,s.pos.y+Y_STEP));handled=true}else if(e.key==='PageDown'){selectedShapes.forEach(s=>s.pos.y=Math.max(0,s.pos.y-Y_STEP));handled=true}else if(e.key==='ArrowLeft'){selectedShapes.forEach(s=>s.rot.y-=step);handled=true}else if(e.key==='ArrowRight'){selectedShapes.forEach(s=>s.rot.y+=step);handled=true}else if(e.key==='ArrowUp'){selectedShapes.forEach(s=>s.rot.x-=step);handled=true}else if(e.key==='ArrowDown'){selectedShapes.forEach(s=>s.rot.x+=step);handled=true}if(handled){e.preventDefault();updateUI()}});

// ===== BUTTON HANDLERS =====
document.getElementById('scaleSlider').addEventListener('input',e=>{if(!selectedShape)return;const ns=parseFloat(e.target.value);selectedShapes.forEach(s=>s.scale=ns);document.getElementById('scaleValue').textContent=ns.toFixed(2);updateUI()});
document.getElementById('yUp').addEventListener('click',()=>{if(selectedShapes.size===0)return;selectedShapes.forEach(s=>s.pos.y=Math.min(MAX_Y,s.pos.y+Y_STEP));updateUI()});
document.getElementById('yDown').addEventListener('click',()=>{if(selectedShapes.size===0)return;selectedShapes.forEach(s=>s.pos.y=Math.max(0,s.pos.y-Y_STEP));updateUI()});
document.getElementById('deleteBtn').addEventListener('click',deleteSelected);
document.getElementById('fuseBtn').addEventListener('click',fuseSelected);
document.getElementById('dupBtn').addEventListener('click',duplicateSelected);
document.getElementById('groupBtn').addEventListener('click',groupSelected);
document.getElementById('saveBtn').addEventListener('click',()=>{if(selectedShape){const n=saveBuildFromShape(selectedShape);alert('Saved as "'+n+'" in the Builds tab!')}});
document.querySelectorAll('.rot-btn[data-axis]').forEach(btn=>{btn.addEventListener('click',()=>{if(selectedShapes.size===0)return;const axis=btn.dataset.axis,dir=parseFloat(btn.dataset.dir),step=Math.PI/12*dir;selectedShapes.forEach(s=>{if(axis==='x')s.rot.x+=step;else if(axis==='y')s.rot.y+=step;else if(axis==='z')s.rot.z+=step});updateUI()})});
document.getElementById('resetRotation').addEventListener('click',()=>{if(selectedShapes.size===0)return;selectedShapes.forEach(s=>s.rot=v3(0,0,0));updateUI()});
document.getElementById('viewTop').addEventListener('click',()=>{camera.yaw=.0001;camera.pitch=1.5;camera.distance=38});
document.getElementById('viewFront').addEventListener('click',()=>{camera.yaw=0;camera.pitch=.05;camera.distance=38});
document.getElementById('viewIso').addEventListener('click',()=>{camera.yaw=.7;camera.pitch=.55;camera.distance=38});
document.getElementById('viewReset').addEventListener('click',()=>{camera.yaw=.7;camera.pitch=.55;camera.distance=38;camera.target=v3(0,3,0)});

(function setupColors(){const row=document.getElementById('colorRow');COLORS.forEach((c,i)=>{const sw=document.createElement('div');sw.className='color-swatch'+(i===0?' active':'');sw.style.backgroundColor=c.hex;sw.title=c.name;sw.addEventListener('click',()=>{activeColor=COLORS[i];document.querySelectorAll('.color-swatch').forEach(s=>s.classList.remove('active'));sw.classList.add('active');selectedShapes.forEach(shape=>{if(shape.isFused)shape.parts.forEach(p=>p.color=activeColor);else shape.color=activeColor});updateUI()});row.appendChild(sw)})})();

// ---------- IMPORT ----------
document.getElementById('importBtn').addEventListener('click',()=>document.getElementById('importInput').click());
document.getElementById('importInput').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=ev=>{try{const data=JSON.parse(ev.target.result);if(Array.isArray(data)){let count=0;data.forEach(item=>{const s=makeShape(item.type,item.x||0,item.z||0);if(s){if(item.scale)s.scale=item.scale;if(item.y)s.pos.y=item.y;if(item.rot)s.rot=v3(item.rot.x||0,item.rot.y||0,item.rot.z||0);shapes.push(s);count++}});alert('Imported '+count+' shapes')}updateUI()}catch(err){alert('Invalid JSON file: '+err.message)}};reader.readAsText(file);e.target.value=''});

// ---------- MODAL / TABS ----------
const modal=document.getElementById('shapeModal'),overlay=document.getElementById('overlay'),shapeToggle=document.getElementById('shapeToggle'),shapeGrid=document.getElementById('shapeGrid'),shapeSearch=document.getElementById('shapeSearch'),closeModal=document.getElementById('closeModal'),dragGhost=document.getElementById('dragGhost');
let currentTab='shapes';
function openModal(){modal.classList.add('open');overlay.classList.add('open');shapeToggle.classList.add('open');shapeSearch.value='';filterShapes('');shapeSearch.focus()}
function closeModalFn(){modal.classList.remove('open');overlay.classList.remove('open');shapeToggle.classList.remove('open');dragGhost.classList.remove('show')}
shapeToggle.addEventListener('click',openModal);
closeModal.addEventListener('click',closeModalFn);
overlay.addEventListener('click',closeModalFn);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal.classList.contains('open'))closeModalFn()});

document.querySelectorAll('.tab').forEach(tab=>{
  tab.addEventListener('click',()=>{
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    tab.classList.add('active');
    currentTab=tab.dataset.tab;
    shapeSearch.placeholder = currentTab==='builds' ? 'Search builds...' : 'Search shapes...';
    shapeSearch.value='';
    rebuildGrid();
  });
});

function rebuildGrid(){
  shapeGrid.innerHTML='';
  if(currentTab==='shapes'){
    shapeNames.forEach(name=>shapeGrid.appendChild(makeShapeItem(name)));
  } else {
    if(builds.length===0){
      const empty=document.createElement('div');
      empty.className='empty-builds';
      empty.textContent='No builds saved yet. Create something on the canvas, then click "💾 Save Build" — or use "Fuse" to auto-save a merged object.';
      shapeGrid.appendChild(empty);
    } else {
      builds.forEach(b=>shapeGrid.appendChild(makeBuildItem(b)));
    }
  }
  filterShapes(shapeSearch.value);
}

function makeShapeItem(name){
  const item=document.createElement('div');
  item.className='shape-modal-item';
  item.dataset.shape=name;
  item.dataset.name=name.toLowerCase();
  item.dataset.kind='shape';
  item.title='Drag onto canvas or click to add '+name;
  let label=name.replace(/_/g,' ').replace(/\d+$/,'').trim();
  if(label.length>10)label=label.substring(0,9)+'..';
  item.innerHTML=`<div class="icon">${getIcon(name)}</div><div class="lbl">${label}</div>`;
  item.addEventListener('click',()=>{addShapeAtCenter(name);closeModalFn()});
  item.setAttribute('draggable','true');
  item.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/plain','shape:'+name);e.dataTransfer.effectAllowed='copy';dragGhost.textContent='📦 '+name;dragGhost.classList.add('show');dragGhost.style.left=e.clientX+'px';dragGhost.style.top=e.clientY+'px'});
  item.addEventListener('dragend',()=>{dragGhost.classList.remove('show')});
  return item;
}

function makeBuildItem(build){
  const item=document.createElement('div');
  item.className='shape-modal-item build';
  item.dataset.build=build.id;
  item.dataset.name=build.name.toLowerCase();
  item.dataset.kind='build';
  item.title='Drag onto canvas or click to place '+build.name;
  item.innerHTML=`<div class="icon">🏗️</div><div class="lbl">${build.name}</div><button class="del-build" title="Delete build">✕</button>`;
  item.addEventListener('click',(e)=>{
    if(e.target.classList.contains('del-build'))return;
    addBuildToScene(build);closeModalFn();
  });
  item.querySelector('.del-build').addEventListener('click',(e)=>{
    e.stopPropagation();
    if(confirm('Delete '+build.name+'?')) deleteBuild(build.id);
  });
  item.setAttribute('draggable','true');
  item.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/plain','build:'+build.id);e.dataTransfer.effectAllowed='copy';dragGhost.textContent='🏗️ '+build.name;dragGhost.classList.add('show');dragGhost.style.left=e.clientX+'px';dragGhost.style.top=e.clientY+'px'});
  item.addEventListener('dragend',()=>{dragGhost.classList.remove('show')});
  return item;
}

document.addEventListener('drag',e=>{if(dragGhost.classList.contains('show')){dragGhost.style.left=e.clientX+'px';dragGhost.style.top=e.clientY+'px'}});
function filterShapes(q){const lq=(q||'').toLowerCase();shapeGrid.querySelectorAll('.shape-modal-item').forEach(item=>{const name=item.dataset.name;item.style.display=(lq===''||name.includes(lq))?'':'none'})}
shapeSearch.addEventListener('input',e=>filterShapes(e.target.value));

function addShapeAtCenter(type){let s;if(HUMAN_PARTS[type])s=makeShape(type,Math.random()*6-3,Math.random()*6-3);else if(GEO[type]){const a=Math.random()*Math.PI*2,r=1+Math.random()*3;s=makeShape(type,Math.cos(a)*r,Math.sin(a)*r)}if(s){shapes.push(s);setSelection([s])}updateUI()}

canvas.addEventListener('dragover',e=>{e.preventDefault();e.dataTransfer.dropEffect='copy'});
canvas.addEventListener('drop',e=>{
  e.preventDefault();
  dragGhost.classList.remove('show');
  const data=e.dataTransfer.getData('text/plain');
  if(!data)return;
  const rect=canvas.getBoundingClientRect(),mx=e.clientX-rect.left,my=e.clientY-rect.top,ray=screenRay(mx,my),gp=rayGroundY0(ray);
  let x,z;
  if(gp){x=Math.max(-MAP_SIZE,Math.min(MAP_SIZE,gp.x));z=Math.max(-MAP_SIZE,Math.min(MAP_SIZE,gp.z))}
  else{const a=Math.random()*Math.PI*2,r=1+Math.random()*2;x=Math.cos(a)*r;z=Math.sin(a)*r}
  if(data.startsWith('build:')){
    const id=parseInt(data.slice(6),10);
    const build=builds.find(b=>b.id===id);
    if(build){
      const parts=build.parts.map(p=>({type:p.type,geo:p.geo,relPos:v3(p.relPos.x,p.relPos.y,p.relPos.z),rot:v3(p.rot.x,p.rot.y,p.rot.z),scale:p.scale,color:{...p.color}}));
      const shape={isFused:true,isBuild:true,parts,pos:v3(x,0,z),rot:v3(0,0,0),scale:1,color:build.color};
      shapes.push(shape);setSelection([shape]);
    }
  } else if(data.startsWith('shape:')){
    const type=data.slice(6);
    const s=makeShape(type,x,z);
    if(s){shapes.push(s);setSelection([s])}
  }
  updateUI();
});
window.addEventListener('dragover',e=>e.preventDefault());
window.addEventListener('drop',e=>{e.preventDefault();dragGhost.classList.remove('show')});

const iconMap={box:'■',sphere:'●',cylinder:'⬭',cone:'▲',torus:'◎',tetra:'◈',octa:'◆',pyramid:'△',prism:'◣',capsule:'⬮',torusKnot:'❋',star:'⭐',hexPrism:'⬡',triPrism:'▲',disc:'⚪',ring:'◎',cross:'✚',tube:'⭕',frustum:'🔻',arrow:'➤',diamond:'💎',gear:'⚙',human_stand:'🧍',human_tall:'🧍',human_short:'🧍',human_child:'🧒'};
function getIcon(n){if(iconMap[n])return iconMap[n];if(n.startsWith('sphere'))return '●';if(n.startsWith('cyl'))return '⬭';if(n.startsWith('cone'))return '▲';if(n.startsWith('torus'))return '◎';if(n.startsWith('star'))return '⭐';if(n.startsWith('prism'))return '◣';if(n.startsWith('pyr'))return '△';if(n.startsWith('gear'))return '⚙';if(n.startsWith('ring'))return '◎';if(n.startsWith('tube'))return '⭕';if(n.startsWith('frustum'))return '🔻';if(n.startsWith('cross'))return '✚';if(n.startsWith('arrow'))return '➤';if(n.startsWith('sph'))return '●';if(n.startsWith('box'))return '■';if(n.startsWith('human'))return '🧍';return '◇'}

// ---------- INIT ----------
function init(){resizeCanvas();addDemoShapes();rebuildGrid();updateUI()}
window.addEventListener('resize',()=>resizeCanvas());
function loop(){render();requestAnimationFrame(loop)}
init();loop();
})();
</script>
</body>
</html>
